# Local MySQL 8 for development:  docker compose up -d
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: retain_samples
      MYSQL_USER: retain
      MYSQL_PASSWORD: retain_pass
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
volumes:
  mysql_data:
